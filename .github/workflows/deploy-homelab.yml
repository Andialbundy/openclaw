name: Deploy to Homelab

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE_NAME_LOWER: andialbundy/openclaw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11

      - name: Install and build
        run: |
          pnpm install
          pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LOWER }}:buildcache,mode=max

      - name: Deploy to Homelab
        env:
          HOMELAB_SSH_KEY: ${{ secrets.HOMELAB_SSH_KEY }}
          HOMELAB_HOST: ${{ secrets.HOMELAB_HOST || '192.168.178.211' }}
          HOMELAB_CONTAINER: ${{ secrets.HOMELAB_CONTAINER || '102' }}
        run: |
          set -euo pipefail

          # Setup SSH
          mkdir -p ~/.ssh
          echo "$HOMELAB_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$HOMELAB_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Deploying image: $IMAGE"

          # Pull image in container
          echo "Pulling image in LXC ${HOMELAB_CONTAINER}..."
          ssh root@"${HOMELAB_HOST}" "pct exec ${HOMELAB_CONTAINER} -- docker pull '${IMAGE}'" || exit 1

          # Update docker-compose
          echo "Updating docker-compose.yml..."
          ssh root@"${HOMELAB_HOST}" "pct exec ${HOMELAB_CONTAINER} -- sed -i 's|image: ghcr.io/openclaw/openclaw:.*|image: '${IMAGE}'|g' /opt/services/docker-compose.yml"

          # Restart services
          echo "Restarting OpenClaw service..."
          ssh root@"${HOMELAB_HOST}" "pct exec ${HOMELAB_CONTAINER} -- docker-compose -f /opt/services/docker-compose.yml up -d openclaw"

          # Health check
          echo "Running health checks..."
          for i in {1..30}; do
            if ssh root@"${HOMELAB_HOST}" "pct exec ${HOMELAB_CONTAINER} -- docker exec openclaw-gateway curl -sf http://localhost:18789/healthz >/dev/null 2>&1"; then
              echo "✓ Health check PASSED"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "✗ Health check FAILED"
              ssh root@"${HOMELAB_HOST}" "pct exec ${HOMELAB_CONTAINER} -- docker logs openclaw-gateway" | tail -20
              exit 1
            fi
            sleep 2
          done

          echo "✓ Deployment complete"

      - name: Notify deployment
        if: success()
        run: |
          echo "✅ Deployment successful"
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed"
          exit 1
