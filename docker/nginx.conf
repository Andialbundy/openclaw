user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 50M;

  # Rate limiting: 10 requests per second per IP
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_status 429;

  # Map to check Bearer token (hardcoded for now, can be externalized)
  # To enable auth, set token below or use htpasswd
  map $http_authorization $bearer_token_valid {
    default 0;
    "~^Bearer openclaw-secret$" 1;
  }

  server {
    listen 80;
    server_name _;

    # Redirect HTTP to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }

    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
  }

  server {
    listen 443 ssl http2;
    server_name _;

    # Self-signed certificates
    ssl_certificate /etc/letsencrypt/live/openclaw.hofernexus.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openclaw.hofernexus.ch/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location / {
      # Rate limiting
      limit_req zone=api_limit burst=20 nodelay;

      # Optional authentication: uncomment below to require Bearer token
      # if ($bearer_token_valid = 0) {
      #   return 401;
      # }

      # Proxy to OpenClaw gateway
      proxy_pass http://openclaw-gateway:18789;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_connect_timeout 75s;
    }

    # Health check endpoint
    location /healthz {
      access_log off;
      proxy_pass http://openclaw-gateway:18789/healthz;
    }
  }
}
